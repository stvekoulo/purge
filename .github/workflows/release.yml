name: Build & Release Windows Installers (x64, ARM64, x86)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
          - arch: ARM64
            rid: win-arm64
          - arch: x86
            rid: win-x86

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies (${{ matrix.rid }})
        run: dotnet restore PurgeWin.csproj -r ${{ matrix.rid }} -p:Platform=${{ matrix.arch }}

      - name: Build Release (${{ matrix.rid }})
        run: dotnet build PurgeWin.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.arch }} --no-restore

      - name: Build Inno Setup Installer (Purge-Setup-win-${{ matrix.arch }}.exe)
        shell: pwsh
        run: |
          $archLower = "${{ matrix.arch }}".ToLower()
          $outDir = "..\bin\${{ matrix.arch }}\Release\net10.0-windows10.0.19041.0\${{ matrix.rid }}"
          $version = if ("${{ github.ref_name }}" -like "v*") { "${{ github.ref_name }}".TrimStart('v') } else { "1.0.0" }
          iscc "installer\PurgeSetup.iss" "/DMyAppVersion=$version" "/DMyArch=$archLower" "/DSourceDir=$outDir"
          $setupPath = "dist\Purge-Setup-v$version-win-$archLower.exe"
          Write-Output "SETUP_PATH=$setupPath" >> $env:GITHUB_ENV

      - name: Upload Installer Artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: Purge-Setup-win-${{ matrix.arch }}
          path: ${{ env.SETUP_PATH }}

      - name: Attach Installer to GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SETUP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
