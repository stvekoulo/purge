name: Build & Release All Windows Architectures

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
          - arch: arm64
            rid: win-arm64
          - arch: x86
            rid: win-x86

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies (${{ matrix.rid }})
        run: dotnet restore PurgeWin.csproj -r ${{ matrix.rid }} -p:Platform=${{ matrix.arch }}

      - name: Build Release (${{ matrix.rid }})
        run: dotnet build PurgeWin.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.arch }} --no-restore

      - name: Package Archive (Purge-win-${{ matrix.arch }}.zip)
        shell: pwsh
        run: |
          $outDir = "bin\${{ matrix.arch }}\Release\net10.0-windows10.0.19041.0\${{ matrix.rid }}"
          $version = if ("${{ github.ref_name }}" -like "v*") { "${{ github.ref_name }}" } else { "v1.0.0" }
          $zipName = "Purge-$version-win-${{ matrix.arch }}.zip"
          Compress-Archive -Path "$outDir\*" -DestinationPath $zipName -Force
          Write-Output "ZIP_PATH=$zipName" >> $env:GITHUB_ENV

      - name: Upload Build Artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: Purge-win-${{ matrix.arch }}
          path: ${{ env.ZIP_PATH }}

      - name: Attach to GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
