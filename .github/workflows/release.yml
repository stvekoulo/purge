name: Build & Release Windows Installers (x64, ARM64, x86)

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
          - arch: ARM64
            rid: win-arm64
          - arch: x86
            rid: win-x86

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies (${{ matrix.rid }})
        run: dotnet restore PurgeWin.csproj -r ${{ matrix.rid }} -p:Platform=${{ matrix.arch }}

      - name: Test update handling
        if: matrix.arch == 'x64'
        run: dotnet run --project Tests/UpdateTests.csproj -v quiet

      - name: Publish Release (${{ matrix.rid }})
        shell: pwsh
        run: |
          dotnet publish PurgeWin.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.arch }} --self-contained true --no-restore -o "artifacts\${{ matrix.rid }}"
          if ($LASTEXITCODE -ne 0) { throw "Publish failed" }
          $buildDir = "bin\${{ matrix.arch }}\Release\net10.0-windows10.0.19041.0\${{ matrix.rid }}"
          Copy-Item "$buildDir\Purge.pri" "artifacts\${{ matrix.rid }}\Purge.pri" -Force -ErrorAction Stop
          foreach ($file in @("Purge.exe", "Purge.dll", "Purge.pri", "Microsoft.UI.Xaml.dll", "Resources\windows-cache-catalog.json")) {
            if (!(Test-Path -LiteralPath "artifacts\${{ matrix.rid }}\$file")) { throw "Missing publish file: $file" }
          }

      - name: Test published startup on the runner architecture
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $version = ([xml](Get-Content PurgeWin.csproj)).Project.PropertyGroup.Version | Select-Object -First 1
          .\scripts\Test-Startup.ps1 -Executable "artifacts\${{ matrix.rid }}\Purge.exe" -ExpectedVersion "$version.0"

      - name: Build Inno Setup Installer (Purge-Setup-win-${{ matrix.arch }}.exe)
        shell: pwsh
        run: |
          $archLower = "${{ matrix.arch }}".ToLower()
          $outDir = (Resolve-Path "artifacts\${{ matrix.rid }}").Path
          $version = ([xml](Get-Content PurgeWin.csproj)).Project.PropertyGroup.Version | Select-Object -First 1
          iscc "installer\PurgeSetup.iss" "/DMyAppVersion=$version" "/DMyArch=$archLower" "/DSourceDir=$outDir"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $setupPath = "dist\Purge-$version-win-$archLower-Setup.exe"
          if (!(Test-Path -LiteralPath $setupPath)) { throw "Installer was not created: $setupPath" }
          Write-Output "SETUP_PATH=$setupPath" >> $env:GITHUB_ENV

      - name: Upload Installer Artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: Purge-Setup-win-${{ matrix.arch }}
          path: ${{ env.SETUP_PATH }}
          if-no-files-found: error

      - name: Attach Installer to GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SETUP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
