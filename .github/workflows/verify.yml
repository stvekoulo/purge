name: Verify Purge changes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-checks:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run non-destructive regression tests
        run: dotnet run --project Tests/UpdateTests.csproj -v quiet

      - name: Restore Windows app dependencies
        run: dotnet restore PurgeWin.csproj -r win-x64 -p:Platform=x64

      - name: Build Windows app
        run: dotnet build PurgeWin.csproj -c Release -r win-x64 -p:Platform=x64 --no-restore
