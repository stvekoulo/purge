<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">Purge — Declutter your Windows PC safely</title>
  <desc id="desc">Native WinUI 3 disk and developer cache cleaner for Windows with multi-drive scanning, strict allowlist rules, squarified treemap, and Recycle Bin protection.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171615"/>
      <stop offset="60%" stop-color="#1B1920"/>
      <stop offset="100%" stop-color="#221D30"/>
    </linearGradient>
    <linearGradient id="paneBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9A7BFF"/>
      <stop offset="100%" stop-color="#6B4DE6"/>
    </linearGradient>
    <linearGradient id="paneMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C4B2FF"/>
      <stop offset="100%" stop-color="#9B82F8"/>
    </linearGradient>
    <linearGradient id="paneFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3EEFF"/>
      <stop offset="100%" stop-color="#DDD0FF"/>
    </linearGradient>
  </defs>

  <!-- Outer Canvas -->
  <rect width="1200" height="380" rx="24" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1198" height="378" rx="23" fill="none" stroke="#302F2D" stroke-width="1.5"/>

  <!-- Left Column: Identity + Value + Badges -->
  <g id="title-block" transform="translate(56, 48)">
    <!-- Eyebrow Pill -->
    <rect x="0" y="0" width="388" height="32" rx="16" fill="#282634" stroke="#453C64" stroke-width="1"/>
    <circle cx="18" cy="16" r="5" fill="#9A7BFF"/>
    <text x="32" y="21" fill="#D5C8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="0.8">NATIVE WINDOWS 11 · WINUI 3 · .NET 10</text>

    <!-- Layered Windows Mascot Icon + Title -->
    <g transform="translate(0, 52)">
      <!-- Back Pane -->
      <rect x="6" y="4" width="52" height="44" rx="10" transform="skewX(-10)" fill="url(#paneBack)"/>
      <!-- Mid Pane -->
      <rect x="16" y="10" width="52" height="44" rx="10" transform="skewX(-10)" fill="url(#paneMid)"/>
      <!-- Front Pane with Windows cross & smile -->
      <g transform="translate(26, 16) skewX(-10)">
        <rect x="0" y="0" width="54" height="46" rx="10" fill="url(#paneFront)" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.6"/>
        <line x1="27" y1="2" x2="27" y2="44" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.75"/>
        <line x1="2" y1="18" x2="52" y2="18" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.75"/>
        <rect x="13" y="23" width="6.5" height="10" rx="3.2" fill="#5A35F0"/>
        <rect x="34" y="23" width="6.5" height="10" rx="3.2" fill="#5A35F0"/>
        <path d="M 21 35 Q 27 40 33 35" fill="none" stroke="#5A35F0" stroke-width="3" stroke-linecap="round"/>
      </g>
      <!-- Sparkles -->
      <path d="M 10 0 L 12 5 L 17 7 L 12 9 L 10 14 L 8 9 L 3 7 L 8 5 Z" fill="#C4B2FF"/>

      <text x="96" y="54" fill="#ECEAE6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">Purge</text>
    </g>

    <!-- Concrete Description -->
    <text x="0" y="156" fill="#ECEAE6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="600">Declutter your Windows PC. Safely.</text>
    <text x="0" y="190" fill="#A6A39D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">Inspect app caches, developer build artifacts, large files, duplicates,</text>
    <text x="0" y="216" fill="#A6A39D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">and app leftovers across all drives — always routed to the Recycle Bin.</text>

    <!-- Feature Chips -->
    <g transform="translate(0, 244)">
      <rect x="0" y="0" width="154" height="34" rx="17" fill="#1B2E22" stroke="#2D523A" stroke-width="1"/>
      <text x="77" y="22" text-anchor="middle" fill="#5FD36B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600">✓ Recycle Bin First</text>

      <rect x="164" y="0" width="148" height="34" rx="17" fill="#282725" stroke="#3D3B38" stroke-width="1"/>
      <text x="238" y="22" text-anchor="middle" fill="#ECEAE6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600">Multi-Drive Scan</text>

      <rect x="322" y="0" width="136" height="34" rx="17" fill="#282725" stroke="#3D3B38" stroke-width="1"/>
      <text x="390" y="22" text-anchor="middle" fill="#ECEAE6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600">100% Offline</text>

      <rect x="468" y="0" width="110" height="34" rx="17" fill="#282725" stroke="#3D3B38" stroke-width="1"/>
      <text x="523" y="22" text-anchor="middle" fill="#D5C8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600">EN / FR UI</text>
    </g>
  </g>

  <!-- Right Column: Project-Native Storage Card Specimen -->
  <g id="project-proof" transform="translate(676, 38)">
    <rect x="0" y="0" width="472" height="304" rx="18" fill="#1E1D1C" stroke="#302F2D" stroke-width="1.5"/>

    <!-- Card Header -->
    <text x="24" y="40" fill="#ECEAE6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">119 GB used</text>
    <text x="172" y="40" fill="#807D78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">of 255 GB</text>
    <text x="448" y="40" text-anchor="end" fill="#A6A39D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">136 GB free</text>

    <!-- 7-Segment Okabe-Ito Storage Bar -->
    <g transform="translate(24, 56)">
      <rect x="0" y="0" width="424" height="14" rx="7" fill="#4E4B47"/>
      <rect x="0" y="0" width="28" height="14" rx="7" fill="#6CC3F0"/>
      <rect x="24" y="0" width="54" height="14" fill="#3A94D0"/>
      <rect x="78" y="0" width="42" height="14" fill="#F0B020"/>
      <rect x="120" y="0" width="58" height="14" fill="#E8772A"/>
      <rect x="178" y="0" width="76" height="14" fill="#A8A49D"/>
    </g>

    <!-- Category Rows -->
    <g transform="translate(20, 88)">
      <!-- Row 1: App Caches -->
      <rect x="0" y="0" width="432" height="44" rx="10" fill="#252422"/>
      <rect x="10" y="8" width="28" height="28" rx="7" fill="#3A9BD5"/>
      <text x="50" y="27" fill="#ECEAE6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">App Caches</text>
      <rect x="166" y="12" width="56" height="20" rx="6" fill="#1B2E22"/>
      <text x="194" y="26" text-anchor="middle" fill="#5FD36B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Safe</text>
      <text x="416" y="27" text-anchor="end" fill="#ECEAE6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">1.2 GB</text>

      <!-- Row 2: Dev Tools -->
      <rect x="0" y="50" width="432" height="44" rx="10" fill="#252422"/>
      <rect x="10" y="58" width="28" height="28" rx="7" fill="#1E78BA"/>
      <text x="50" y="77" fill="#ECEAE6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">Dev Tools &amp; Builds</text>
      <text x="416" y="77" text-anchor="end" fill="#ECEAE6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">5.4 GB</text>

      <!-- Row 3: Large Files -->
      <rect x="0" y="100" width="432" height="44" rx="10" fill="#252422"/>
      <rect x="10" y="108" width="28" height="28" rx="7" fill="#F0B020"/>
      <text x="50" y="127" fill="#ECEAE6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">Large Files &amp; Duplicates</text>
      <text x="416" y="127" text-anchor="end" fill="#ECEAE6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">4.9 GB</text>

      <!-- Row 4: Uninstaller & Leftovers -->
      <rect x="0" y="150" width="432" height="44" rx="10" fill="#252422"/>
      <rect x="10" y="158" width="28" height="28" rx="7" fill="#E8772A"/>
      <text x="50" y="177" fill="#ECEAE6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">Apps &amp; Orphaned Leftovers</text>
      <text x="416" y="177" text-anchor="end" fill="#ECEAE6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">14.8 GB</text>
    </g>
  </g>
</svg>
