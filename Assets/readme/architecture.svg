<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="310" viewBox="0 0 1200 310"
     role="img" aria-labelledby="title desc">
  <title id="title">Purge Safety Architecture Pipeline</title>
  <desc id="desc">Three-stage architecture: Multi-Drive Parallel Scanner feeds the Strict Allowlist and Safety Classifier, which routes all deletions through the Windows Recycle Bin shell API.</desc>

  <rect width="1200" height="310" rx="22" fill="#171615"/>
  <rect x="1" y="1" width="1198" height="308" rx="21" fill="none" stroke="#302F2D" stroke-width="1.5"/>

  <text x="56" y="48" fill="#8A6CF6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1.2">SAFETY-FIRST ARCHITECTURE</text>
  <text x="56" y="82" fill="#ECEAE6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700">Why Purge never breaks your credentials, repos, or OS</text>

  <!-- Stage 1 -->
  <g transform="translate(56, 110)">
    <rect x="0" y="0" width="336" height="164" rx="16" fill="#1E1D1C" stroke="#302F2D" stroke-width="1.5"/>
    <rect x="20" y="20" width="36" height="36" rx="10" fill="#282634"/>
    <text x="38" y="44" text-anchor="middle" fill="#B8A2FF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">01</text>
    <text x="70" y="45" fill="#ECEAE6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700">Multi-Drive Parallel Scan</text>
    <text x="20" y="82" fill="#A6A39D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Enumerates all fixed drives (C:, D:, E:)</text>
    <text x="20" y="108" fill="#A6A39D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">while skipping reparse points and</text>
    <text x="20" y="134" fill="#A6A39D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">OneDrive dehydrated cloud placeholders.</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 402 192 L 424 192" stroke="#8A6CF6" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 418 186 L 426 192 L 418 198" fill="none" stroke="#8A6CF6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stage 2 -->
  <g transform="translate(432, 110)">
    <rect x="0" y="0" width="336" height="164" rx="16" fill="#1E1D1C" stroke="#302F2D" stroke-width="1.5"/>
    <rect x="20" y="20" width="36" height="36" rx="10" fill="#1B2E22"/>
    <text x="38" y="44" text-anchor="middle" fill="#5FD36B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">02</text>
    <text x="70" y="45" fill="#ECEAE6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700">Allowlist &amp; Safety Guard</text>
    <text x="20" y="82" fill="#A6A39D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Every item is tagged Safe or Check First.</text>
    <text x="20" y="108" fill="#A6A39D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Blocks C:\Windows, Program Files, and</text>
    <text x="20" y="134" fill="#A6A39D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">uncommitted Git worktrees automatically.</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 778 192 L 800 192" stroke="#5FD36B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 794 186 L 802 192 L 794 198" fill="none" stroke="#5FD36B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stage 3 -->
  <g transform="translate(808, 110)">
    <rect x="0" y="0" width="336" height="164" rx="16" fill="#1E1D1C" stroke="#302F2D" stroke-width="1.5"/>
    <rect x="20" y="20" width="36" height="36" rx="10" fill="#332910"/>
    <text x="38" y="44" text-anchor="middle" fill="#F2B84B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">03</text>
    <text x="70" y="45" fill="#ECEAE6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700">Recycle Bin Shell API</text>
    <text x="20" y="82" fill="#A6A39D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Uses native SHFileOperationW with</text>
    <text x="20" y="108" fill="#A6A39D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">FOF_ALLOWUNDO so every cleaned file</text>
    <text x="20" y="134" fill="#A6A39D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">can be restored from Recycle Bin.</text>
  </g>
</svg>
